<div id="app">
<div id="stage">
  <canvas id="map" width="960" height="600"></canvas>
  <div id="hud" class="hidden">
    <div id="hud-left" class="hud-box"><canvas id="hud-mon" width="32" height="32"></canvas><div><div id="hud-name">지우</div><div class="mini-hp"><div id="hud-hp"></div></div><div id="hud-hptxt" style="font-size:14px">HP 30/30</div></div></div>
    <div id="hud-mid" class="hud-box">시작 마을</div>
    <div id="hud-right"><div class="hud-box"><div class="badges" id="hud-badges"></div><div id="hud-cp" style="font-size:14px;margin-top:3px">용기 0</div></div><button id="sound-btn" class="btn" aria-label="소리">🔊</button></div>
  </div>
  <div id="pad" class="hidden">
    <div id="dpad">
      <button class="up" data-dir="up" aria-label="위">▲</button>
      <button class="left" data-dir="left" aria-label="왼쪽">◀</button>
      <button class="right" data-dir="right" aria-label="오른쪽">▶</button>
      <button class="down" data-dir="down" aria-label="아래">▼</button>
    </div>
    <button id="menubtn">메뉴</button>
    <button id="abtn">A<br><span style="font-size:17px">말하기</span></button>
  </div>
  <div id="dialog" class="hidden"><div class="who hidden"></div><div class="txt"></div><div class="choices"></div><div class="more">▼</div></div>

  <div id="title" class="scene show">
    <div class="logo">매뜨몬스터</div>
    <div class="sub">사칙연산 몬스터 모험</div>
    <div class="title-mons" id="title-mons"></div>
    <div class="menu-col">
      <button class="btn primary hidden" id="btn-resume">하던 게임 계속하기</button>
      <button class="btn primary" id="btn-new">새로 시작</button>
      <button class="btn blue" id="btn-load">이어하기 (저장 코드)</button>
      <button class="btn" id="btn-teacher">교사용 설정</button>
    </div>
  </div>

  <div id="name" class="scene bg-sky">
    <div class="panel" style="width:560px">
      <h2>주인공 이름을 정해요</h2>
      <p>이름은 5글자까지 쓸 수 있어요.</p>
      <input id="name-input" class="name" maxlength="10" value="지우" autocomplete="off">
      <div class="err" id="name-err"></div>
      <div class="row-btns"><button class="btn" id="name-back">뒤로</button><button class="btn primary" id="name-ok">정했어요!</button></div>
    </div>
  </div>

  <div id="pick" class="scene bg-sky">
    <div style="text-align:center;margin-top:40px"><div class="sub" style="color:#fff">함께할 몬스터를 골라요!</div></div>
    <div class="pick-row" id="pick-row"></div>
    <div class="row-btns"><button class="btn" id="pick-back">뒤로</button><button class="btn primary" id="pick-ok" disabled>이 몬스터로 할래요!</button></div>
  </div>

  <div id="load" class="scene bg-sky">
    <div class="panel" style="width:680px">
      <h2>이어하기</h2>
      <p>선생님께 받은 저장 코드를 붙여 넣어요.</p>
      <textarea id="load-input" class="code" placeholder="MM1. 으로 시작하는 저장 코드"></textarea>
      <div class="err" id="load-err"></div>
      <div class="row-btns"><button class="btn" id="load-back">뒤로</button><button class="btn primary" id="load-ok">불러오기</button></div>
    </div>
  </div>

  <div id="teacher" class="scene bg-sky">
    <div class="panel">
      <h2 style="margin-bottom:6px">교사용 설정</h2>
      <div id="set-rows"></div>
      <div class="row-btns"><button class="btn red" id="set-reset">진행 초기화</button><button class="btn primary" id="set-back">저장하고 돌아가기</button></div>
      <div id="set-note" style="font-size:16px;font-weight:700;color:#555;margin-top:8px">설정은 이 기기에서 게임하는 동안 유지되고, 저장 코드에도 함께 들어가요.</div>
    </div>
  </div>

  <div id="battle" class="scene">
    <div class="b-field">
      <div class="plat e"></div><div class="plat a"></div>
      <canvas class="spr e" id="spr-e" width="32" height="32"></canvas>
      <canvas class="spr a" id="spr-a" width="32" height="32"></canvas>
      <div class="guard-ic" id="guard-ic">🛡️</div>
      <div class="info e"><div class="nm"><span id="e-name">몬스터</span><span id="e-lv"></span></div><div class="hprow"><span>HP</span><div class="hpbar" id="e-bar"><div class="hpfill" id="e-fill"></div></div><div class="slots hidden" id="e-slots"></div></div><div class="hpnum" id="e-num"></div></div>
      <div class="info a"><div class="nm"><span id="a-name">내 몬스터</span><span id="a-lv"></span></div><div class="hprow"><span>HP</span><div class="hpbar" id="a-bar"><div class="hpfill" id="a-fill"></div></div><div class="slots hidden" id="a-slots"></div></div><div class="hpnum" id="a-num"></div></div>
      <div class="hint hidden" id="hint"><button class="btn x" id="hint-x" aria-label="힌트 닫기">✕</button><div id="hint-body"></div></div>
    </div>
    <div class="b-bottom">
      <div class="qpanel">
        <div class="timer hidden" id="timer"><div id="timer-fill"></div></div>
        <div class="qmsg" id="qmsg"><span id="qmsg-t"></span><span class="more" id="qmsg-more">▼</span></div>
        <div class="qarea hidden" id="qarea">
          <div class="qtop"><div class="qpic" id="qpic"></div><div class="qtext" id="qtext"></div></div>
          <div class="ans" id="ans"></div>
          <div class="acts"><button class="btn" id="act-guard">🛡️ 방어</button><button class="btn" id="act-hint">💡 힌트</button><button class="btn" id="act-run">🏃 도망가기</button></div>
        </div>
      </div>
      <div class="keypad" id="keypad"></div>
    </div>
  </div>

  <div id="ending" class="scene">
    <div class="logo">축하해요!</div>
    <div class="sub" id="end-sub">챔피언이 되었어요!</div>
    <div class="end-badges" id="end-badges"></div>
    <div class="title-mons"><canvas id="end-mon" width="32" height="32" style="width:150px;height:150px"></canvas></div>
    <p style="font-size:24px;font-weight:900;margin:8px 0 18px" id="end-msg"></p>
    <button class="btn primary" id="end-ok">처음 화면으로</button>
  </div>

  <div id="menu" class="modal"><div class="panel">
    <h2>메뉴</h2>
    <div class="menu-col">
      <button class="btn primary" id="m-save">💾 저장 코드 만들기</button>
      <button class="btn" id="m-sound">🔊 소리 끄기</button>
      <button class="btn" id="m-motion">움직임 줄이기: 끔</button>
      <button class="btn" id="m-title">처음 화면으로</button>
      <button class="btn blue" id="m-close">닫기</button>
    </div>
  </div></div>

  <div id="savebox" class="modal"><div class="panel">
    <h2>저장 코드</h2>
    <p>아래 코드를 복사해서 보관하세요. 다음 시간에 "이어하기"에 붙여 넣으면 돼요.</p>
    <textarea id="save-code" class="code" readonly></textarea>
    <div class="err" id="save-msg" style="color:#2b8a3e"></div>
    <div class="row-btns"><button class="btn primary" id="save-copy">📋 복사하기</button><button class="btn blue" id="save-close">닫기</button></div>
  </div></div>

  <div id="confirm" class="modal"><div class="panel">
    <h2 id="cf-title">확인</h2><p id="cf-text"></p>
    <div class="row-btns"><button class="btn" id="cf-no">아니요</button><button class="btn red" id="cf-yes">네</button></div>
  </div></div>

  <div id="fade"></div>
  <div id="toast"></div>
</div>
<div id="rotate"><div class="ic">📱</div><p>태블릿이나 휴대폰을<br>가로로 돌려 주세요!</p><button class="btn primary" id="rotate-ok">그래도 계속하기</button></div>
</div>
