<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매뜨몬스터</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; background: #e7f5ff; text-align: center; }
  a.btn { display: inline-block; margin-top: 20px; padding: 14px 26px; font-size: 18px; background: #1971c2; color: #fff; border-radius: 10px; text-decoration: none; }
</style>
</head>
<body>
  <p>매뜨몬스터를 열고 있어요...</p>
  <a class="btn" id="go" href="#">바로 열기</a>
  <script>
    // ▼ 여기에 Apps Script 웹 앱 URL(… /exec 로 끝나는 주소)을 붙여넣으세요. 따옴표 안에만 넣습니다.
    var GAS_URL = "여기에_웹앱_URL을_붙여넣으세요";
    document.getElementById("go").href = GAS_URL;
    if (GAS_URL.indexOf("/exec") !== -1) {
      window.location.replace(GAS_URL);
    }
  </script>
</body>
</html>
