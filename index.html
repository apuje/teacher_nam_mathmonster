<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>매뜨몬스터</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#15152a;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nanum Gothic",sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;color:#222}
body{height:100dvh}
#app{position:fixed;left:0;top:0;width:100%;height:100%;height:100dvh;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:960px;height:600px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%;background:#000;overflow:hidden;border-radius:8px}
#map{position:absolute;left:0;top:0;width:960px;height:600px;image-rendering:pixelated}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.btn{min-height:56px;min-width:56px;padding:6px 18px;font-size:24px;font-weight:800;color:#222;background:#fff;border:4px solid #222;border-radius:12px;box-shadow:0 5px 0 #222}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #222}
.btn.primary{background:#ffd43b}.btn.blue{background:#74c0fc}.btn.green{background:#8ce99a}.btn.red{background:#ffa8a8}
.btn[disabled]{opacity:.45}
.hidden{display:none!important}
/* HUD */
#hud{position:absolute;left:0;top:0;width:960px;height:76px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px}
.hud-box{background:#f8f8f0;border:4px solid #1d1d1d;border-radius:8px;padding:5px 10px;font-weight:800;font-size:17px;box-shadow:inset 0 0 0 3px #f8f8f0,inset 0 0 0 5px #7f9cf5,0 3px 0 #1d1d1d}
#hud-left{display:flex;align-items:center;gap:8px}
#hud-left canvas{width:40px;height:40px;image-rendering:pixelated}
.mini-hp{width:150px;height:12px;border:2px solid #222;border-radius:6px;background:#555;overflow:hidden;margin-top:3px}
.mini-hp>div{height:100%;background:#40c057;transition:width .4s}
#hud-mid{position:absolute;left:12px;top:88px;font-size:15px;line-height:1.35;text-align:left;max-width:300px;padding:4px 10px;border-width:2px;box-shadow:0 2px 0 #222;z-index:2}
#hud-right{display:flex;gap:8px;align-items:center}
.badges{display:flex;gap:5px}
.badge{width:30px;height:30px;border-radius:50%;border:3px dashed #999;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff;background:#eee}
.badge.on{border:3px solid #222;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
#sound-btn{pointer-events:auto;min-height:52px;min-width:52px;font-size:24px;padding:0}
/* pad */
#pad{position:absolute;left:0;top:0;width:960px;height:600px;pointer-events:none}
#dpad{position:absolute;left:18px;bottom:18px;width:228px;height:228px;pointer-events:none}
#dpad button{position:absolute;width:76px;height:76px;pointer-events:auto;font-size:30px;font-weight:900;background:rgba(255,255,255,.85);border:4px solid #222;border-radius:14px;box-shadow:0 4px 0 #222;touch-action:none}
#dpad .up{left:76px;top:0}#dpad .down{left:76px;top:152px}#dpad .left{left:0;top:76px}#dpad .right{left:152px;top:76px}
#dpad button.on{background:#ffd43b}
#abtn{position:absolute;right:26px;bottom:34px;width:110px;height:110px;border-radius:50%;pointer-events:auto;font-size:26px;font-weight:900;background:#ff6b6b;color:#fff;border:5px solid #222;box-shadow:0 6px 0 #222;touch-action:none}
#menubtn{position:absolute;right:150px;bottom:30px;width:96px;height:60px;pointer-events:auto;font-size:21px;font-weight:900;background:rgba(255,255,255,.9);border:4px solid #222;border-radius:14px;box-shadow:0 4px 0 #222}
/* dialog */
#dialog{position:absolute;left:200px;right:200px;bottom:16px;min-height:150px;background:#f8f8f0;border:5px solid #1d1d1d;border-radius:10px;box-shadow:inset 0 0 0 4px #f8f8f0,inset 0 0 0 7px #7f9cf5,0 6px 0 #1d1d1d;padding:16px 22px 14px;font-size:25px;font-weight:700;line-height:1.45;z-index:40;cursor:pointer}
#dialog .who{position:absolute;top:-22px;left:16px;background:#f8d030;color:#1d1d1d;border:3px solid #1d1d1d;border-radius:8px;padding:2px 12px;font-size:19px;font-weight:900}
#dialog .more{position:absolute;right:16px;bottom:8px;font-size:20px;animation:blink 1s infinite}
#dialog .choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
#dialog .choices .btn{font-size:22px;min-height:56px;padding:4px 16px}
@keyframes blink{50%{opacity:0}}
/* scenes */
.scene{position:absolute;left:0;top:0;width:960px;height:600px;display:none;z-index:20}
.scene.show{display:block}
#title{background:radial-gradient(#fff 1.4px,transparent 2px) 0 0/54px 46px,radial-gradient(#ffe066 1px,transparent 2px) 20px 23px/71px 61px,linear-gradient(#1b2a63,#3b5bdb 58%,#7ec8e3 58%,#8fd16b 80%,#4c9a3b);text-align:center}
.logo{margin-top:46px;font-size:84px;font-weight:900;color:#ffd43b;letter-spacing:4px;-webkit-text-stroke:4px #1c1c3a;text-shadow:0 6px 0 #1c1c3a,6px 8px 0 #3b5bdb}
.sub{display:inline-block;font-size:24px;font-weight:900;color:#fff;background:#1d1d1d;border:3px solid #f8f8f0;border-radius:20px;padding:4px 18px;margin-top:6px;box-shadow:0 3px 0 #111}
.title-mons{display:flex;justify-content:center;gap:24px;margin:16px 0 8px}
.title-mons canvas{width:96px;height:96px;image-rendering:pixelated}
.menu-col{display:flex;flex-direction:column;align-items:center;gap:14px}
.menu-col .btn{width:330px}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:5px solid #222;border-radius:16px;box-shadow:0 8px 0 #222;padding:24px 30px;text-align:center}
.panel h2{font-size:32px;margin-bottom:14px}
.panel p{font-size:21px;font-weight:700;margin-bottom:10px;line-height:1.45}
.bg-sky{background:linear-gradient(#a5d8ff,#e7f5ff)}
input.name{font-size:36px;font-weight:800;text-align:center;width:300px;height:68px;border:4px solid #222;border-radius:12px;margin:10px 0 18px;font-family:inherit}
textarea.code{width:560px;height:110px;font-size:18px;border:4px solid #222;border-radius:12px;padding:10px;font-family:monospace;resize:none;user-select:text;-webkit-user-select:text}
.err{color:#e03131;font-weight:900;font-size:21px;min-height:30px}
.pick-row{display:flex;gap:16px;justify-content:center;margin:8px 0 14px}
.pick-card{width:180px;height:230px;background:#fff;border:5px solid #222;border-radius:16px;box-shadow:0 6px 0 #222;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.pick-card canvas{width:128px;height:128px;image-rendering:pixelated}
.pick-card b{font-size:26px}.pick-card span{font-size:18px;font-weight:700;color:#555}
.pick-card.sel{background:#fff3bf;outline:6px solid #fab005}
/* teacher */
#teacher .panel{width:860px;padding:18px 26px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:2px dashed #ccc;gap:10px}
.set-row>span{font-size:21px;font-weight:900;text-align:left}
.seg{display:flex;gap:6px}
.seg .btn{font-size:18px;min-height:52px;padding:4px 12px;box-shadow:0 3px 0 #222}
.seg .btn.on{background:#ffd43b}
/* battle */
#battle{background:#f8f9fa}
.b-field{position:absolute;left:0;top:0;width:960px;height:330px;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(0,0,0,.035) 38px 40px),linear-gradient(#a8e0f0 0,#d8f3f9 48%,#8fd16b 48%,#5fae4a 100%);overflow:hidden}
#battle.boss .b-field{background:linear-gradient(#2b2d6e 0,#4c5cb8 48%,#a16bd6 48%,#6e3ea8 100%)}
.plat{position:absolute;width:250px;height:56px;border-radius:50%;background:#8ce99a;border:4px solid #2b8a3e}
#battle.boss .plat{background:#ffc078;border-color:#c2410c}
.plat.e{right:90px;top:170px}.plat.a{left:70px;top:275px}
.spr{position:absolute;width:176px;height:176px;image-rendering:pixelated}
.spr.e{right:128px;top:20px}.spr.a{left:108px;top:125px;transform:scaleX(-1)}
.info{position:absolute;background:#f8f8f0;border:4px solid #1d1d1d;border-radius:10px;padding:8px 14px;width:330px;box-shadow:inset 0 0 0 3px #f8f8f0,inset 0 0 0 5px #7f9cf5,0 4px 0 #1d1d1d}
.info.e{left:30px;top:24px}.info.a{right:30px;top:198px}
.info .nm{font-size:23px;font-weight:900;display:flex;justify-content:space-between}
.hprow{display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:900;font-size:16px}
.hprow>span{background:#f8d030;border:2px solid #1d1d1d;border-radius:4px;padding:0 6px;font-size:14px;color:#1d1d1d;line-height:18px}
.hpbar{flex:1;height:14px;border:3px solid #1d1d1d;border-radius:3px;background:#404040;overflow:hidden}
.hpfill{height:100%;width:100%;background:#48c078;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:width .5s ease}
.hpfill.mid{background:#f8d030}.hpfill.low{background:#f85848}
.hpnum{font-size:18px;font-weight:900;text-align:right;margin-top:2px}
.slots{display:flex;gap:6px;flex:1}
.slots i{flex:1;height:18px;border:3px solid #1d1d1d;border-radius:3px;background:#48c078}
.slots i.off{background:#495057}
.guard-ic{position:absolute;left:250px;top:150px;font-size:44px;display:none}
.guard-ic.on{display:block}
.hint{position:absolute;left:200px;top:10px;width:560px;max-height:310px;overflow:auto;background:#fffbe6;border:4px solid #f08c00;border-radius:14px;padding:10px 14px;z-index:5;font-size:19px;font-weight:700;line-height:1.4;box-shadow:0 4px 0 #f08c00}
.hint h4{font-size:21px;color:#e8590c;margin-bottom:4px}
.hint .x{position:absolute;right:8px;top:6px;min-height:44px;min-width:44px;font-size:20px;padding:0}
.blocks{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.blocks.rows{flex-direction:column;align-items:flex-start}
.blocks .row{display:flex;gap:4px}
.blk{width:22px;height:22px;border:2px solid #222;border-radius:4px;background:#74c0fc;position:relative}
.blk.o{background:#ffa94d}.blk.x::after{content:'✕';position:absolute;left:1px;top:-4px;font-size:20px;color:#e03131;font-weight:900}
.blk.gap{margin-right:14px}
pre.vert{font-family:"Courier New",monospace;font-size:30px;font-weight:900;line-height:1.15;background:#fff;border:3px solid #222;border-radius:8px;padding:6px 14px;display:inline-block;margin:4px 0}
.b-bottom{position:absolute;left:0;top:330px;width:960px;height:270px;background:#3a3a46;border-top:6px solid #1d1d1d;padding:10px;display:flex;gap:10px}
.qpanel{position:relative;flex:1;background:#f8f8f0;border:5px solid #1d1d1d;border-radius:10px;box-shadow:inset 0 0 0 4px #f8f8f0,inset 0 0 0 7px #7f9cf5;padding:10px 16px;display:flex;flex-direction:column}
.qmsg{font-size:27px;font-weight:800;line-height:1.4;flex:1;display:flex;align-items:center;cursor:pointer}
.qmsg .more{margin-left:auto;align-self:flex-end;animation:blink 1s infinite}
.qarea{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.qtop{display:flex;align-items:center;gap:12px;min-height:84px}
.qpic{font-size:52px;line-height:1}
.qtext{font-size:46px;font-weight:900;letter-spacing:1px}
.qtext.word{font-size:21px;font-weight:800;letter-spacing:0;line-height:1.38}
.qtext.mix{font-size:38px}
.ans{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:900;flex-wrap:wrap}
.slot{min-width:110px;height:56px;border:4px solid #222;border-radius:10px;background:#f1f3f5;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 10px;cursor:pointer}
.slot.focus{background:#fff3bf;border-color:#f08c00}
.slot.shake{animation:shake .35s}
.acts{display:flex;gap:10px;margin-top:6px}
.acts .btn{font-size:20px;min-height:56px;padding:2px 14px;box-shadow:0 4px 0 #222}
.acts .btn.on{background:#ffd43b}
.timer{position:absolute;left:12px;right:12px;top:4px;height:6px;border-radius:3px;background:#dee2e6;overflow:hidden}
.timer>div{height:100%;background:#f76707;width:100%}
.keypad{width:330px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad .btn{font-size:30px;padding:0;min-height:56px;height:56px;box-shadow:0 4px 0 #111}
.keypad .btn.ok{background:#8ce99a;font-size:24px}.keypad .btn.del{background:#ffc9c9;font-size:24px}
/* motion */
.lunge-a{animation:lungeA .45s ease}
.lunge-e{animation:lungeE .45s ease}
.hit{animation:hit .45s steps(2) }
.faint{transition:transform .6s ease-in,opacity .6s;opacity:0}
.spr.e.faint{transform:translateY(80px)}.spr.a.faint{transform:scaleX(-1) translateY(80px)}
@keyframes lungeA{0%{transform:scaleX(-1) translate(0,0)}45%{transform:scaleX(-1) translate(-120px,-60px)}100%{transform:scaleX(-1) translate(0,0)}}
@keyframes lungeE{0%{transform:translate(0,0)}45%{transform:translate(-120px,60px)}100%{transform:translate(0,0)}}
@keyframes hit{0%,50%{opacity:.15}25%,75%,100%{opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#stage.reduce .lunge-a,#stage.reduce .lunge-e{animation-duration:.2s}
#stage.reduce .hit{animation:none;filter:brightness(1.6)}
#stage.reduce .slot.shake{animation:none}
#stage.reduce .hpfill{transition-duration:.15s}
/* flash / fade */
#fade{position:absolute;left:0;top:0;width:960px;height:600px;background:#000;opacity:0;pointer-events:none;z-index:60;transition:opacity .25s}
#fade.on{opacity:1}
#toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);background:#222;color:#fff;font-size:22px;font-weight:800;padding:10px 22px;border-radius:12px;z-index:70;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:.95}
/* modal */
.modal{position:absolute;left:0;top:0;width:960px;height:600px;background:rgba(0,0,0,.55);z-index:50;display:none}
.modal.show{display:block}
#menu .panel{width:520px}
#menu .menu-col .btn{width:380px}
#savebox .panel{width:700px}
#confirm .panel{width:560px}
.row-btns{display:flex;gap:14px;justify-content:center;margin-top:12px;flex-wrap:wrap}
/* ending */
#ending{background:linear-gradient(#ffe066,#ffa94d);text-align:center}
#ending .logo{font-size:64px;margin-top:40px}
.end-badges{display:flex;gap:18px;justify-content:center;margin:22px 0}
.end-badges .badge{width:84px;height:84px;font-size:44px}
#rotate{position:fixed;left:0;top:0;width:100%;height:100%;background:#1c1c3a;color:#fff;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:22px}
#rotate.show{display:flex}
#rotate .ic{font-size:80px;animation:rot 2s infinite}
#rotate p{font-size:26px;font-weight:900;line-height:1.5}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
.fx{position:absolute;z-index:6;pointer-events:none}
.fx svg{width:100%;height:100%;display:block}
#battle.flash::after{content:'';position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;animation:flashout .45s ease-out forwards;pointer-events:none;z-index:7}
@keyframes flashout{from{opacity:.75}to{opacity:0}}
</style>
</head>
<body>
<div id="app">
<div id="stage">
  <canvas id="map" width="960" height="600"></canvas>
  <div id="hud" class="hidden">
    <div id="hud-left" class="hud-box"><canvas id="hud-mon" width="32" height="32"></canvas><div><div id="hud-name">지우</div><div class="mini-hp"><div id="hud-hp"></div></div><div id="hud-hptxt" style="font-size:14px">HP 30/30</div></div></div>
    <div id="hud-mid" class="hud-box">시작 마을</div>
    <div id="hud-right"><div class="hud-box"><div class="badges" id="hud-badges"></div><div id="hud-cp" style="font-size:14px;margin-top:3px">용기 0</div></div><button id="sound-btn" class="btn" aria-label="소리">🔊</button></div>
  </div>
  <div id="pad" class="hidden">
    <div id="dpad">
      <button class="up" data-dir="up" aria-label="위">▲</button>
      <button class="left" data-dir="left" aria-label="왼쪽">◀</button>
      <button class="right" data-dir="right" aria-label="오른쪽">▶</button>
      <button class="down" data-dir="down" aria-label="아래">▼</button>
    </div>
    <button id="menubtn">메뉴</button>
    <button id="abtn">A<br><span style="font-size:17px">말하기</span></button>
  </div>
  <div id="dialog" class="hidden"><div class="who hidden"></div><div class="txt"></div><div class="choices"></div><div class="more">▼</div></div>

  <div id="title" class="scene show">
    <div class="logo">매뜨몬스터</div>
    <div class="sub">사칙연산 몬스터 모험</div>
    <div class="title-mons" id="title-mons"></div>
    <div class="menu-col">
      <button class="btn primary hidden" id="btn-resume">하던 게임 계속하기</button>
      <button class="btn primary" id="btn-new">새로 시작</button>
      <button class="btn blue" id="btn-load">이어하기 (저장 코드)</button>
      <button class="btn" id="btn-teacher">교사용 설정</button>
    </div>
  </div>

  <div id="name" class="scene bg-sky">
    <div class="panel" style="width:560px">
      <h2>주인공 이름을 정해요</h2>
      <p>이름은 5글자까지 쓸 수 있어요.</p>
      <input id="name-input" class="name" maxlength="10" value="지우" autocomplete="off">
      <div class="err" id="name-err"></div>
      <div class="row-btns"><button class="btn" id="name-back">뒤로</button><button class="btn primary" id="name-ok">정했어요!</button></div>
    </div>
  </div>

  <div id="pick" class="scene bg-sky">
    <div style="text-align:center;margin-top:40px"><div class="sub" style="color:#fff">함께할 몬스터를 골라요!</div></div>
    <div class="pick-row" id="pick-row"></div>
    <div class="row-btns"><button class="btn" id="pick-back">뒤로</button><button class="btn primary" id="pick-ok" disabled>이 몬스터로 할래요!</button></div>
  </div>

  <div id="load" class="scene bg-sky">
    <div class="panel" style="width:680px">
      <h2>이어하기</h2>
      <p>선생님께 받은 저장 코드를 붙여 넣어요.</p>
      <textarea id="load-input" class="code" placeholder="MM1. 으로 시작하는 저장 코드"></textarea>
      <div class="err" id="load-err"></div>
      <div class="row-btns"><button class="btn" id="load-back">뒤로</button><button class="btn primary" id="load-ok">불러오기</button></div>
    </div>
  </div>

  <div id="teacher" class="scene bg-sky">
    <div class="panel">
      <h2 style="margin-bottom:6px">교사용 설정</h2>
      <div id="set-rows"></div>
      <div class="row-btns"><button class="btn red" id="set-reset">진행 초기화</button><button class="btn primary" id="set-back">저장하고 돌아가기</button></div>
      <div id="set-note" style="font-size:16px;font-weight:700;color:#555;margin-top:8px">설정은 이 기기에서 게임하는 동안 유지되고, 저장 코드에도 함께 들어가요.</div>
    </div>
  </div>

  <div id="battle" class="scene">
    <div class="b-field">
      <div class="plat e"></div><div class="plat a"></div>
      <canvas class="spr e" id="spr-e" width="32" height="32"></canvas>
      <canvas class="spr a" id="spr-a" width="32" height="32"></canvas>
      <div class="guard-ic" id="guard-ic">🛡️</div>
      <div class="info e"><div class="nm"><span id="e-name">몬스터</span><span id="e-lv"></span></div><div class="hprow"><span>HP</span><div class="hpbar" id="e-bar"><div class="hpfill" id="e-fill"></div></div><div class="slots hidden" id="e-slots"></div></div><div class="hpnum" id="e-num"></div></div>

  on('load-back', 'click', function () { renderTitle(); });
  on('load-ok', 'click', function () { if (!loadCode($('load-input').value)) $('load-err').textContent = '올바른 저장 코드가 아닙니다. 다시 확인해 주세요.'; });
  on('set-back', 'click', function () { Sound.sfx('select'); renderTitle(); });
  on('set-reset', 'click', async function () {
    var yes = await confirmBox('진행 초기화', '지금 하던 게임 진행(이름, 뱃지, 몬스터 기록)을 모두 지울까요? 저장 코드는 지워지지 않아요.');
    if (yes) { S = null; curMap = null; MAPS = {}; spriteCache = {}; toast('진행을 초기화했어요.'); log('reset'); renderTitle(); renderTeacher(); }
  });
  on('sound-btn', 'click', function () { settings.sound = settings.sound ? 0 : 1; applySettings(); });
  on('menubtn', 'click', function () { if (busy()) return; Sound.sfx('select'); showModal('menu', true); });
  on('m-close', 'click', function () { showModal('menu', false); });
  on('m-save', 'click', function () { openSave(); });
  on('m-sound', 'click', function () { settings.sound = settings.sound ? 0 : 1; applySettings(); });
  on('m-motion', 'click', function () { settings.reduceMotion = settings.reduceMotion ? 0 : 1; applySettings(); });
  on('m-title', 'click', function () { showModal('menu', false); renderTitle(); });
  on('save-copy', 'click', copySave);
  on('save-close', 'click', function () { showModal('savebox', false); });
  on('end-ok', 'click', function () { renderTitle(); });
  on('dialog', 'click', function () { advanceDlg(); });
  on('qmsg', 'click', msgTap);
  on('hint-x', 'click', function () { $('hint').classList.add('hidden'); });
  on('act-hint', 'click', function () { if ($('hint').classList.contains('hidden')) openHint(); else $('hint').classList.add('hidden'); });
  on('act-guard', 'click', toggleGuard);
  on('act-run', 'click', runAway);
  on('rotate-ok', 'click', function () { rotateDismissed = true; fit(); });

  // 키패드
  (function () {
    var kp = $('keypad');
    ['7', '8', '9', '4', '5', '6', '1', '2', '3', 'del', '0', 'ok'].forEach(function (k) {
      var b = document.createElement('button'); b.className = 'btn' + (k === 'ok' ? ' ok' : k === 'del' ? ' del' : ''); b.setAttribute('data-k', k);
      b.textContent = k === 'ok' ? '확인' : k === 'del' ? '지우기' : k;
      b.addEventListener('click', function () { keyIn(k); });
      kp.appendChild(b);
    });
  })();

  // 방향 버튼 (누르고 있으면 계속 이동)
  qa('#dpad button').forEach(function (b) {
    var d = b.getAttribute('data-dir');
    function down(e) { e.preventDefault(); input.dir = d; b.classList.add('on'); if (!P.moving) tryMove(d); }
    function up() { if (input.dir === d) input.dir = null; b.classList.remove('on'); }
    b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
    b.addEventListener('click', function () { if (!P.moving && !input.dir) tryMove(d); });
  });
  on('abtn', 'pointerdown', function (e) { e.preventDefault(); aPress(); });
  // 모바일: 캐릭터 주변을 누르고 있으면 그 방향으로 계속 이동 (손을 떼면 멈춤)
  var mapEl = $('map'), touchDir = null;
  mapEl.style.touchAction = 'none';
  function dirFromTouch(e) {
    var r = mapEl.getBoundingClientRect(), px = (e.clientX - r.left) * (mapEl.width / r.width), py = (e.clientY - r.top) * (mapEl.height / r.height);
    var dx = px - PS.x, dy = py - PS.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return null;
    return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  }
  mapEl.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'touch' || Battle.active || !S || anyModalOpen()) return;
    e.preventDefault(); var d = dirFromTouch(e);
    if (d) { touchDir = d; input.dir = d; if (!P.moving) tryMove(d); }
  });
  mapEl.addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'touch' || !touchDir) return;
    var d = dirFromTouch(e); if (d) { touchDir = d; input.dir = d; }
  });
  function touchEnd(e) { if (e.pointerType !== 'touch') return; touchDir = null; input.dir = null; }
  mapEl.addEventListener('pointerup', touchEnd); mapEl.addEventListener('pointercancel', touchEnd); mapEl.addEventListener('pointerleave', touchEnd);
  function aPress() { if (Dlg.open) { advanceDlg(); return; } interact(); }

  var KEYDIR = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (Battle.active) {
      if (msgWait && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); msgTap(); return; }
      if (/^[0-9]$/.test(e.key)) keyIn(e.key);
      else if (e.key === 'Backspace') { e.preventDefault(); keyIn('del'); }
      else if (e.key === 'Enter') keyIn('ok');
      else if (e.key === 'Tab' && B && B.problem && B.problem.twoPart) { e.preventDefault(); B.focus = 1 - B.focus; renderAnswer(); }
      return;
    }
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'z') { e.preventDefault(); aPress(); return; }
    var d = KEYDIR[e.key]; if (d) { e.preventDefault(); input.dir = d; }
  });
  document.addEventListener('keyup', function (e) { var d = KEYDIR[e.key]; if (d && input.dir === d) input.dir = null; });
  window.addEventListener('blur', function () { input.dir = null; });

  // =============== 화면 맞추기 ===============
  var rotateDismissed = false;
  function fit() {
    var w = window.innerWidth || 960, h = window.innerHeight || 600;
    var s = Math.min(w / VW, h / VH);
    $('stage').style.setProperty('--s', s);
    $('rotate').classList.toggle('show', h > w * 1.05 && !rotateDismissed);
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  // =============== 테스트용 도우미 ===============
  MM.state = function () { return S; };
  MM.map = function () { return curMap; };
  MM.dlgOpen = function () { return Dlg.open; };
  MM.advance = advanceDlg;
  MM.interact = interact;
  MM.tryMove = tryMove;
  MM.face = function (d) { S.dir = d; };
  MM.msgTap = msgTap;
  MM.waitingMsg = function () { return !!msgWait; };
  MM.battleActive = function () { return Battle.active; };
  MM.ps = function () { return PS; };
  MM.qLocked = function () { return !B || B.locked; };

  // 시작
  fit(); applySettings(); renderTitle();
  if (window.requestAnimationFrame) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
